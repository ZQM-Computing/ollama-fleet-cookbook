name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: pip install numpy

      - name: Syntax-check scripts and Python
        run: |
          bash -n scripts/*.sh
          python -m py_compile python/rag_minimal.py

      - name: RAG self-test (offline, no Ollama server)
        run: python python/rag_minimal.py --self-test
