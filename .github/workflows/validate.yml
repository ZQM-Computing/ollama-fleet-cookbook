name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: pip install numpy

      - name: Syntax-check scripts and Python
        run: |
          bash -n scripts/*.sh
          python -m py_compile python/rag_minimal.py

      - name: RAG self-test (offline, no Ollama server)
        run: python python/rag_minimal.py --self-test
