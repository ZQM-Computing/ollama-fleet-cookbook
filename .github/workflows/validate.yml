name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: pip install numpy

      - name: Syntax-check scripts and Python
        run: |
          bash -n scripts/*.sh
          python -m py_compile python/rag_minimal.py

      - name: RAG self-test (offline, no Ollama server)
        run: python python/rag_minimal.py --self-test
